<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xFoot - Live</title>
    <link rel="stylesheet" href="styles.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="header-title">
                <a href="dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                    <span>⚽</span>
                    <span>xFoot</span>
                    <span class="pro-badge">SITE</span>
                </a>
            </div>
            <nav class="desktop-nav">
                <a href="index.html" class="desktop-nav-link">
                    <span class="nav-icon">✨</span>
                    <span>AI Analysis</span>
                </a>
                <a href="live.html" class="desktop-nav-link active">
                    <span class="nav-icon">⏱️</span>
                    <span>Live x3</span>
                </a>
                <a href="history.html" class="desktop-nav-link">
                    <span class="nav-icon">📊</span>
                    <span>Historique</span>
                </a>
                <a href="arena.html" class="desktop-nav-link">
                    <span class="nav-icon">🏟️</span>
                    <span>AI Arena</span>
                </a>
                <a href="vip.html" class="desktop-nav-link">
                    <span class="nav-icon">👑</span>
                    <span>VIP</span>
                </a>
            </nav>
            <div class="header-actions">
                <span class="user-email" id="user-email">...</span>
                <button class="icon-btn" id="logout-btn" title="Déconnexion">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-content">

            <h2 class="section-title">Matchs en direct</h2>

            <div id="live-loading" class="stat-row">Chargement…</div>
            <div id="live-error" class="error-msg hidden"></div>

            <div id="live-empty" class="empty-state hidden">
                <span class="empty-icon">⏱️</span>
                Aucun match en direct pour le moment.<br>Reviens pendant une journée de championnat.
            </div>

            <div id="live-matches"></div>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="history.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Historique</span>
            </a>
            <a href="live.html" class="nav-item active">
                <span class="nav-icon">⏱️</span>
                <span>Live x3</span>
            </a>
            <a href="index.html" class="nav-item">
                <span class="nav-icon">✨</span>
                <span>AI Analysis</span>
            </a>
            <a href="arena.html" class="nav-item">
                <span class="nav-icon">🏟️</span>
                <span>AI Arena</span>
            </a>
            <a href="vip.html" class="nav-item">
                <span class="nav-icon">👑</span>
                <span>VIP</span>
            </a>
        </nav>

    </div>

    <script src="api.js"></script>
    <script>
        requireAuth();

        // Logos officiels par ligue (media.api-sports.io/football/leagues/<id>.png,
        // mêmes ids qu'API_FOOTBALL_LEAGUE_IDS côté backend) — statiques,
        // pas besoin de les faire transiter par /live-scores.
        const LEAGUE_LOGOS = {
            PremierLeague: 'https://media.api-sports.io/football/leagues/39.png',
            LaLiga: 'https://media.api-sports.io/football/leagues/140.png',
            SerieA: 'https://media.api-sports.io/football/leagues/135.png',
            Bundesliga: 'https://media.api-sports.io/football/leagues/78.png',
            Ligue1: 'https://media.api-sports.io/football/leagues/61.png',
            PrimeiraLiga: 'https://media.api-sports.io/football/leagues/94.png',
            MLS: 'https://media.api-sports.io/football/leagues/253.png',
            SaudiProLeague: 'https://media.api-sports.io/football/leagues/307.png',
            ChampionsLeague: 'https://media.api-sports.io/football/leagues/2.png',
            EuropaLeague: 'https://media.api-sports.io/football/leagues/3.png',
            ConferenceLeague: 'https://media.api-sports.io/football/leagues/848.png',
        };

        // Noms d'affichage lisibles — m.league est la clé interne brute
        // (ex. "SaudiProLeague") renvoyée par /live-scores.
        const LEAGUE_DISPLAY_NAMES = {
            PremierLeague: 'Premier League',
            LaLiga: 'LaLiga',
            SerieA: 'Serie A',
            Bundesliga: 'Bundesliga',
            Ligue1: 'Ligue 1',
            PrimeiraLiga: 'Liga Portugal',
            MLS: 'MLS',
            SaudiProLeague: 'Saudi Pro League',
            ChampionsLeague: 'Champions League',
            EuropaLeague: 'Europa League',
            ConferenceLeague: 'Conference League',
        };

        const STATUS_LABELS = {
            '1H': '1ère mi-temps',
            'HT': 'Mi-temps',
            '2H': '2ème mi-temps',
            'ET': 'Prolongation',
            'BT': 'Pause',
            'P': 'Tirs au but',
            'SUSP': 'Suspendu',
            'INT': 'Interrompu',
        };

        function formatStatus(statusShort, elapsed) {
            const label = STATUS_LABELS[statusShort] || 'En direct';
            return elapsed !== null && elapsed !== undefined ? `${label} · ${elapsed}'` : label;
        }

        function getInitials(name) {
            return name.substring(0, 2).toUpperCase();
        }

        function renderMatch(m, idx) {
            const delayClass = `animate-delay-${(idx % 3) + 1}`;
            const homeInitial = getInitials(m.home_team);
            const awayInitial = getInitials(m.away_team);
            const homeLogoHtml = m.home_logo
                ? `<img src="${m.home_logo}" alt="${m.home_team}" loading="lazy" onerror="this.outerHTML='${homeInitial}'">`
                : homeInitial;
            const awayLogoHtml = m.away_logo
                ? `<img src="${m.away_logo}" alt="${m.away_team}" loading="lazy" onerror="this.outerHTML='${awayInitial}'">`
                : awayInitial;
            const leagueLogo = LEAGUE_LOGOS[m.league];
            const leagueLogoHtml = leagueLogo
                ? `<img class="league-logo" src="${leagueLogo}" alt="${m.league}" loading="lazy" onerror="this.outerHTML='🏆'">`
                : '🏆';
            return `
                <div class="match-card animate-fade-in hover-lift ${delayClass}">
                    <div class="match-card-header">
                        <div class="league-info">${leagueLogoHtml} <span>${LEAGUE_DISPLAY_NAMES[m.league] || m.league}</span></div>
                        <div class="badge-live pulse-glow"><span class="live-dot"></span>LIVE</div>
                    </div>
                    <div class="teams-container">
                        <div class="team">
                            <div class="team-logo">${homeLogoHtml}</div>
                            <div class="team-name">${m.home_team}</div>
                        </div>
                        <div class="vs-badge score">${m.home_goals} - ${m.away_goals}</div>
                        <div class="team">
                            <div class="team-logo">${awayLogoHtml}</div>
                            <div class="team-name">${m.away_team}</div>
                        </div>
                    </div>
                    <div class="live-minute" style="text-align: center;">${formatStatus(m.status_short, m.elapsed)}</div>
                </div>
            `;
        }

        async function loadLiveScores() {
            const loadingEl = document.getElementById('live-loading');
            const errorEl = document.getElementById('live-error');
            const emptyEl = document.getElementById('live-empty');
            const matchesEl = document.getElementById('live-matches');

            try {
                const response = await apiFetch('/live-scores');
                if (!response.ok) {
                    const body = await response.json().catch(() => ({}));
                    throw new Error(body.detail || `Erreur (${response.status})`);
                }
                const matches = await response.json();

                loadingEl.classList.add('hidden');
                errorEl.classList.add('hidden');

                if (matches.length === 0) {
                    emptyEl.classList.remove('hidden');
                    matchesEl.innerHTML = '';
                } else {
                    emptyEl.classList.add('hidden');
                    matchesEl.innerHTML = matches.map((m, idx) => renderMatch(m, idx)).join('');
                }
            } catch (e) {
                loadingEl.classList.add('hidden');
                errorEl.textContent = e.message || "Erreur lors du chargement des scores en direct.";
                errorEl.classList.remove('hidden');
            }
        }

        async function loadCurrentUser() {
            try {
                const response = await apiFetch('/auth/me');
                const user = await response.json();
                const userEmailNode = document.getElementById('user-email');
                userEmailNode.textContent = user.name || user.email.split('@')[0];
                userEmailNode.title = user.email;
            } catch (e) {
                console.error("Auth error", e);
            }
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            clearToken();
            window.location.href = 'login.html';
        });

        loadCurrentUser();
        loadLiveScores();

        // Rafraîchi pendant que la page reste ouverte — le cache serveur
        // (voir _get_live_scores dans api/main.py) absorbe le coût réel,
        // ce setInterval ne déclenche pas un appel API-Football à chaque fois.
        const refreshInterval = setInterval(loadLiveScores, 60000);
        window.addEventListener('beforeunload', () => clearInterval(refreshInterval));
    </script>
</body>
</html>
