<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xFoot - Abonnement</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <!-- Floating footballs -->
        <div class="football foot-1">⚽</div>
        <div class="football foot-2">⚽</div>
        <div class="football foot-3">⚽</div>
        <div class="football foot-4">⚽</div>
        <div class="football foot-5">⚽</div>
        <div class="football foot-6">⚽</div>
    </div>

    <header class="header">
        <div class="logo">
            <span class="icon">⚽</span> xFoot
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-outline" style="text-decoration: none;">Retour au dashboard</a>
        </div>
    </header>

    <main class="main-content">
        <div class="glass-panel">
            <h1 class="title">Abonnement</h1>
            <p class="subtitle" id="subscription-status" style="margin-bottom: 1rem;">Chargement du statut…</p>
            <p class="info-text">Chariow ne renouvelle pas automatiquement une licence : reviens sur cette page avant ou après expiration pour la prolonger, avec le même formulaire.</p>

            <form class="prediction-form billing-form" id="checkout-form">
                <div class="form-group full-width">
                    <label>Plan</label>
                    <div class="plan-selector">
                        <label class="plan-option">
                            <input type="radio" name="plan" value="monthly" checked>
                            <div class="plan-card">
                                <h4>Mensuel</h4>
                                <div class="price">1000 FCFA<span>/mois</span></div>
                            </div>
                        </label>
                        <label class="plan-option">
                            <input type="radio" name="plan" value="yearly">
                            <div class="plan-card">
                                <h4>Annuel</h4>
                                <div class="price">10000 FCFA<span>/an</span></div>
                                <div class="badge">Économisez 2 mois</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" class="form-control" id="first-name" placeholder="Entrez votre prénom" required>
                </div>

                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" class="form-control" id="last-name" placeholder="Entrez votre nom" required>
                </div>

                <div class="form-group">
                    <label>Pays</label>
                    <select class="form-control" id="country">
                        <option value="CI">Côte d'Ivoire (+225)</option>
                        <option value="SN">Sénégal (+221)</option>
                        <option value="ML">Mali (+223)</option>
                        <option value="CM">Cameroun (+237)</option>
                        <option value="TG">Togo (+228)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Numéro de téléphone (Mobile Money)</label>
                    <input type="tel" class="form-control" id="phone-number" placeholder="0700000000" required>
                </div>

                <p id="checkout-error" style="color: var(--accent-warning); display: none;" class="full-width"></p>

                <div class="form-actions full-width">
                    <button type="submit" class="btn-primary btn-block" id="checkout-btn">Continuer vers le paiement</button>
                </div>
            </form>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        requireAuth();

        const statusEl = document.getElementById('subscription-status');
        const errorEl = document.getElementById('checkout-error');
        const checkoutBtn = document.getElementById('checkout-btn');

        async function loadSubscriptionStatus() {
            const response = await apiFetch('/billing/subscription');
            const sub = await response.json();
            if (sub.is_active) {
                const expiry = sub.current_period_end
                    ? ` (expire le ${new Date(sub.current_period_end).toLocaleDateString('fr-FR')})`
                    : '';
                statusEl.textContent = `Abonnement actif — plan ${sub.plan}${expiry}. Renouvelle ou change de plan ci-dessous.`;
            } else {
                statusEl.textContent = 'Aucune licence active. Choisis un plan pour débloquer les prédictions.';
            }
        }

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            checkoutBtn.disabled = true;

            const plan = document.querySelector('input[name="plan"]:checked').value;
            const body = {
                plan,
                first_name: document.getElementById('first-name').value,
                last_name: document.getElementById('last-name').value,
                phone_number: document.getElementById('phone-number').value,
                phone_country_code: document.getElementById('country').value,
            };

            try {
                const response = await apiFetch('/billing/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.detail || `Erreur (${response.status})`);
                }
                // Redirection réelle vers la page de paiement Chariow hébergée.
                window.location.href = data.checkout_url;
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                checkoutBtn.disabled = false;
            }
        });

        loadSubscriptionStatus();
    </script>
</body>
</html>
